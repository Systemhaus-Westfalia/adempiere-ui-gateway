## Example SSL server block for API gateway
# After Let's Encrypt certs are obtained, copy this file to the running container
# or mount it as /etc/nginx/conf.d/ssl.conf in the `ui-gateway` service.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Change to your domain name(s)
    server_name your.domain.tld;

    ssl_certificate /etc/letsencrypt/live/your.domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.tld/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!aDH;

    access_log /var/log/nginx/api_ssl_access.log main;

    # Include API location fragments
    include /etc/nginx/api_conf.d/*.conf;
    include /etc/nginx/api_conf.d/**/*.conf;

    # API JSON error responses
    include /etc/nginx/api_json_errors.conf;

}
