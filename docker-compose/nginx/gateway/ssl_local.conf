server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name localhost; # Cambia por tu dominio si lo deseas

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!aDH;

    access_log /var/log/nginx/api_ssl_access.log main;

    # Include API location fragments
    include /etc/nginx/api_conf.d/*.conf;
    include /etc/nginx/api_conf.d/**/*.conf;

    # Error responses
    include /etc/nginx/api_json_errors.conf;
}
